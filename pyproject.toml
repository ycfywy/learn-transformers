[project]
name = "transformers-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "python-dotenv>=1.2.2",
    "datasets>=4.8.4",
    "torchvision>=0.26.0",
]

[project.scripts]
train = "scripts.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonPath = ".venv/Scripts/python.exe"
extraPaths = ["src"]
